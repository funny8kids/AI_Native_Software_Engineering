<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 原生软件工程</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="《AI 原生软件工程》—— 当 AI 自己兜不住的时候，组织如何接管。四个真实案例，一套治理方法论。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="theme-color" content="#4f46e5">

  <!-- All assets are self-hosted: zero external CDN dependency -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:20px;">
      <div style="width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#4f46e5;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <p style="color:#4f46e5;font-family:system-ui,sans-serif;font-size:14px;">正在加载…</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>

  <noscript>请启用 JavaScript 以浏览本文档。</noscript>

  <script>
    window.$docsify = {
      name: 'AI 原生软件工程',
      nameLink: '/',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      alias: {
        '/manuscript/.*_sidebar.md': '/_sidebar.md',
        '/manuscript/.*_navbar.md': '/_navbar.md',
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md',
      },
      subMaxLevel: 3,
      maxLevel: 4,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索全书内容…',
        noData: '没有找到匹配结果',
        depth: 3,
      },
      auto2top: true,
      relativePath: false,
      themeColor: '#4f46e5',
      formatUpdated: '{YYYY}-{MM}-{DD}',
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
      },
      plugins: [
        function pageFooter(hook) {
          var footer = [
            '<hr/>',
            '<footer class="page-footer">',
            '<p>《AI 原生软件工程》 · 当 AI 自己兜不住的时候，组织如何接管</p>',
            '<p>AI 做可能，人做选择，人做负责。</p>',
            '</footer>',
          ].join('');
          hook.afterEach(function (html) {
            return html + footer;
          });
        },
        // Self-hosted Mermaid: convert ```mermaid fences after Docsify render
        function mermaidPlugin(hook, vm) {
          var mermaidNodes = [];

          function initMermaid() {
            if (typeof mermaid === 'undefined') return;
            mermaid.initialize({
              startOnLoad: false,
              securityLevel: 'loose',
              theme: 'neutral',
              fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
              flowchart: { curve: 'basis', htmlLabels: true },
              themeVariables: {
                primaryColor: '#eef2ff',
                primaryTextColor: '#1a1d23',
                primaryBorderColor: '#4f46e5',
                lineColor: '#6b7280',
                secondaryColor: '#f7f8fa',
                tertiaryColor: '#ffffff',
                fontSize: '14px',
              },
            });
          }

          hook.doneEach(function () {
            if (typeof mermaid === 'undefined') return;
            initMermaid();

            // Docsify wraps unrendered mermaid in <code class="lang-mermaid"> inside <pre>
            var codes = document.querySelectorAll(
              '.markdown-section pre[data-lang="mermaid"] code, .markdown-section code.lang-mermaid, .markdown-section pre > code.language-mermaid'
            );

            // Fallback: any code whose text looks like mermaid diagram source
            if (!codes.length) {
              var all = document.querySelectorAll('.markdown-section code');
              all.forEach(function (el) {
                var t = el.textContent || '';
                if (/^(flowchart|graph|sequenceDiagram|stateDiagram|erDiagram|gantt|mindmap|timeline|classDiagram|pie)\b/.test(t.trim())) {
                  el.classList.add('lang-mermaid');
                  codes = document.querySelectorAll('.markdown-section code.lang-mermaid');
                }
              });
            }

            var i = 0;
            codes.forEach(function (code) {
              var pre = code.closest('pre');
              var source = code.textContent;
              if (!source || !source.trim()) return;
              var id = 'mermaid-' + Date.now() + '-' + (i++);
              var wrapper = document.createElement('div');
              wrapper.className = 'mermaid-block';
              var label = document.createElement('div');
              label.className = 'mermaid-label';
              wrapper.appendChild(label);
              var host = document.createElement('div');
              host.className = 'mermaid';
              host.id = id;
              host.textContent = source;
              wrapper.appendChild(host);
              if (pre && pre.parentNode) {
                pre.parentNode.replaceChild(wrapper, pre);
              }
              mermaidNodes.push(host);
            });

            if (mermaidNodes.length) {
              try {
                mermaid.run({ nodes: mermaidNodes });
              } catch (e) {
                console.warn('mermaid render failed', e);
              }
              mermaidNodes = [];
            }
          });
        },
      ],
    }
  </script>

  <!-- Self-hosted Docsify core + plugins -->
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/search.min.js"></script>
  <script src="vendor/pagination.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>

  <!-- Self-hosted Prism syntax highlighting -->
  <script src="vendor/prism-core.min.js"></script>
  <script src="vendor/prism-markup.min.js"></script>
  <script src="vendor/prism-clike.min.js"></script>
  <script src="vendor/prism-javascript.min.js"></script>
  <script src="vendor/prism-python.min.js"></script>
  <script src="vendor/prism-bash.min.js"></script>
  <script src="vendor/prism-go.min.js"></script>
  <script src="vendor/prism-rust.min.js"></script>
  <script src="vendor/prism-java.min.js"></script>
  <script src="vendor/prism-yaml.min.js"></script>
  <script src="vendor/prism-json.min.js"></script>
  <script src="vendor/prism-sql.min.js"></script>
  <script src="vendor/prism-diff.min.js"></script>
  <script src="vendor/prism-typescript.min.js"></script>
  <script src="vendor/prism-docker.min.js"></script>
</body>
</html>
