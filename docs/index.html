<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 原生软件工程</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="《AI 原生软件工程》—— 当 AI 自己兜不住的时候，组织如何接管。四个真实案例，一套治理方法论。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- 这一格是浅档 --c-desk 的抄件（第八条守卫按令牌名逐字对账，动过 theme.css 就要动这里）；
       运行时 applyTheme 会按当前档把它改写成实时的 --c-desk，但首屏渲染前浏览器读的是本行。 -->
  <meta name="theme-color" content="#f7f5f0">

  <!-- 主题在首屏渲染前应用，避免深色闪烁。默认浅色；仅当用户明确选过深色才提前设置 -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('ainse-theme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* localStorage 不可用时保持浅色默认 */ }
    })();
  </script>

  <!-- All assets are self-hosted: zero external CDN dependency -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="app">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:20px;">
      <div style="width:40px;height:40px;border:3px solid var(--c-border);border-top-color:var(--c-accent);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <p style="color:var(--c-accent);font-family:system-ui,sans-serif;font-size:14px;">正在加载…</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>

  <noscript>请启用 JavaScript 以浏览本文档。</noscript>

  <script>
    var AINSE_THEME_KEY = 'ainse-theme';

    function ainseGetTheme() {
      try { return localStorage.getItem(AINSE_THEME_KEY) === 'dark' ? 'dark' : 'light'; }
      catch (e) { return 'light'; }
    }

    // 图的颜色不写在这里：一律从 theme.css 的 --c-plate-* 令牌现取。
    // 注意取的是「图版」那一组——它们只在 :root 定义、深档不覆盖，所以两张主题下
    // 图都是同一张纸。mermaid 不认 style 行里的 var()，正文只能带字面量，
    // 而这些字面量的唯一出处就是这组令牌（第八条守卫逐条对账）。
    // 兜底表必须与任何经 ainseToken 读走的令牌一一对应：漏一个名字，取不到值时
    // 就会静默变成 'transparent'，站在暖纸上是一张没有底的图。
    // 值全部取浅档——theme.css 没加载时深档同样不存在，这是唯一自洽的兜底口径。
    var AINSE_FIG_FALLBACK = {
      '--c-plate-node': '#f1ebde', '--c-plate': '#fbf8f1', '--c-plate-onblack': '#fefcf8',
      '--c-plate-ink': '#1e1c19', '--c-plate-accent': '#2f6154', '--c-plate-line': '#6e675c',
      '--c-plate-green': '#e2f3df', '--c-plate-orange': '#ffeada', '--c-plate-purple': '#f5e9f9',
      '--c-plate-amber': '#fcefd3', '--c-plate-red': '#ffe3df', '--c-plate-gray': '#e5ddd0',
      '--c-plate-red-line': '#a03b31', '--c-plate-black-line': '#141310',
      '--c-desk': '#f7f5f0', '--c-accent': '#2b7159'
    };
    function ainseToken(name) {
      var v = '';
      try {
        v = getComputedStyle(document.documentElement).getPropertyValue(name);
      } catch (e) { v = ''; }
      v = (v || '').trim();
      return v || AINSE_FIG_FALLBACK[name] || 'transparent';
    }

    function ainseMermaidVars() {
      // mermaid 的 neutral 主题在构造器里把 mainBkg / nodeBorder / text / border1 /
      // clusterBkg 写成冷灰（#eee #999 #333 #707070），primaryColor 顶不掉它们——
      // 未加 style 行的节点因此站在暖纸上像另一个站点的图（第八条守卫实测 fill=rgb(238,238,238)）。
      // 下面这些键名逐条对照 vendor/mermaid.min.js 的样式模板取用，无一是装饰：
      //   flowchart  .node rect{fill:mainBkg;stroke:nodeBorder} .cluster rect{fill:clusterBkg;stroke:clusterBorder}
      //              .cluster text{fill:titleColor} .label text{fill:nodeTextColor||textColor}
      //   mindmap    .section-N rect|path{fill:cScaleN} .section-N text{fill:cScaleLabelN}（按 THEME_COLOR_LIMIT 循环）
      //   sequence   .actor{fill:actorBkg;stroke:actorBorder} text.actor>tspan{fill:actorTextColor}
      //              .messageText{fill:signalTextColor} .note{fill:noteBkgColor} .noteText{fill:noteTextColor}
      //              .labelBox{fill:labelBoxBkgColor} .loopText{fill:loopTextColor} .sequenceNumber{fill:sequenceNumberColor}
      //   state      .state-end{fill:innerEndBackground} .end-state-inner{fill:compositeBackground||background}
      //              g.stateGroup .state-title{fill:stateLabelColor} .node rect{fill:stateBkg||mainBkg;stroke:stateBorder||nodeBorder}
      //   gantt      .task0{fill:taskBkgColor;stroke:taskBorderColor} .section0{fill:sectionBkgColor}
      //              .done0{fill:doneTaskBkgColor} .active0{fill:activeTaskBkgColor} .crit0{fill:critBkgColor}
      //              .taskText0{fill:taskTextColor} .doneText/.activeText{fill:taskTextDarkColor} .critText{fill:taskTextLightColor}
      //              .grid .tick{stroke:gridColor} .today{stroke:todayLineColor}
      var t = ainseToken;
      var vars = {
        primaryColor: t('--c-plate-node'),
        primaryTextColor: t('--c-plate-ink'),
        primaryBorderColor: t('--c-plate-accent'),
        lineColor: t('--c-plate-line'),
        secondaryColor: t('--c-plate'),
        tertiaryColor: t('--c-plate-onblack'),
        background: t('--c-plate-node'),
        edgeLabelBackground: t('--c-plate'),
        textColor: t('--c-plate-ink'),
        fontSize: '14px',
        mainBkg: t('--c-plate-node'),
        nodeBorder: t('--c-plate-accent'),
        nodeTextColor: t('--c-plate-ink'),
        titleColor: t('--c-plate-ink'),
        clusterBkg: t('--c-plate'),
        clusterBorder: t('--c-plate-line'),
        arrowheadColor: t('--c-plate-line'),
        actorBkg: t('--c-plate-node'), actorBorder: t('--c-plate-accent'),
        actorTextColor: t('--c-plate-ink'), actorLineColor: t('--c-plate-line'),
        signalColor: t('--c-plate-line'), signalTextColor: t('--c-plate-ink'),
        labelBoxBkgColor: t('--c-plate'), labelBoxBorderColor: t('--c-plate-line'),
        labelTextColor: t('--c-plate-ink'), loopTextColor: t('--c-plate-ink'),
        noteBkgColor: t('--c-plate-amber'), noteBorderColor: t('--c-plate-line'),
        noteTextColor: t('--c-plate-ink'),
        activationBkgColor: t('--c-plate-gray'), activationBorderColor: t('--c-plate-accent'),
        sequenceNumberColor: t('--c-plate-ink'),
        stateBkg: t('--c-plate-node'), stateBorder: t('--c-plate-accent'),
        stateLabelColor: t('--c-plate-ink'),
        innerEndBackground: t('--c-plate-ink'), compositeBackground: t('--c-plate-ink'),
        sectionBkgColor: t('--c-plate-gray'), sectionBkgColor2: t('--c-plate-node'),
        altSectionBkgColor: t('--c-plate'), gridColor: t('--c-plate-line'),
        todayLineColor: t('--c-plate-accent'),
        taskBkgColor: t('--c-plate-node'), taskBorderColor: t('--c-plate-accent'),
        taskTextColor: t('--c-plate-ink'), taskTextOutsideColor: t('--c-plate-ink'),
        taskTextDarkColor: t('--c-plate-ink'), taskTextLightColor: t('--c-plate-onblack'),
        activeTaskBkgColor: t('--c-plate-green'), activeTaskBorderColor: t('--c-plate-line'),
        doneTaskBkgColor: t('--c-plate-gray'), doneTaskBorderColor: t('--c-plate-line'),
        critBkgColor: t('--c-plate-red-line'), critBorderColor: t('--c-plate-black-line'),
      };
      // 脑图分区色：mermaid 默认对 primaryColor 做 30°/60°/90° 色相旋转，转出来是冷调
      // 粉彩，标签还按背景明暗自动配成 #333。这里直接复用工整的六色图版、标签统一墨黑。
      var scale = ['--c-plate-node', '--c-plate-green', '--c-plate-orange',
                   '--c-plate-purple', '--c-plate-amber', '--c-plate-red'];
      for (var i = 0; i < 12; i++) {
        vars['cScale' + i] = t(scale[i % scale.length]);
        vars['cScaleLabel' + i] = t('--c-plate-ink');
      }
      return vars;
    }

    // 甘特图在 mermaid 内部按「宿主父元素的 offsetWidth」定宽；本主题的 .mermaid
    // 由插件在 doneEach 里动态生成，那一刻量到的是包裹层而非正文列宽，实测恒为 300px
    // （四案例时间线被压成一小块）。这里显式喂 useWidth = 正文列宽，并在极端窄屏兜底。
    function ainseGanttWidth() {
      var sec = document.querySelector('.markdown-section');
      if (!sec) return 720;
      var probe = sec.querySelector('p, li, h2, td');
      var w = (probe && probe.offsetWidth) || sec.clientWidth || 0;
      if (!w) return 720; // 只在量不到时兜底（零尺寸布局：后台标签页 / 打印）
      // 窄屏不把月份轴硬塞进 300px（实测刻度文字互相压字）：按 600 定宽，
      // 多出来的宽度交给 .mermaid-block 的横向滚动——与同页宽流程图同一策略。
      var narrow = window.matchMedia('(max-width: 768px)').matches;
      return Math.min(Math.max(w, narrow ? 600 : 300), 1200);
    }

    // dark 参数**不**喂给 mermaid：这里固定用 neutral 主题，深浅两套配色由 ainseMermaidVars()
    // 现读页面计算值（getComputedStyle 取 --c-plate-*）灌进 themeVariables。所以换档时图必须
    // 重绘一次（ainseRerenderMermaid）——不是为了让 mermaid 换具名主题，是为了让它重读一遍令牌。
    function ainseInitMermaid(dark) {
      if (typeof mermaid === 'undefined') return;
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        theme: 'neutral',
        fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", sans-serif',
        gantt: { useWidth: ainseGanttWidth() },
        flowchart: { curve: 'basis', htmlLabels: true },
        themeVariables: ainseMermaidVars(),
      });
    }

    // mermaid.run() 返回 Promise，try/catch 拦不住它的拒绝——会以
    // "Uncaught (in promise)" 落进控制台。且首绘 / 封面收起补渲染 / 主题切换重绘
    // 三条路径都会把手上的节点重置 textContent，并行渲染会互相踩。
    // 全局只留一条串行队列：一次一份图在飞；出队时页面已切走就整批作废。
    // 失败仍用 console.error 点名「哪条路径、哪一页、哪张图」——
    // 静默或降级成 warn 等于给交互守卫拆闸（守卫按 0 控制台错误判绿）。
    var ainseMermaidChain = Promise.resolve();
    // 可读性地板：图不许被等比缩到看不清。
    // 上一版只在 768 以下按 viewBox 补 min-width，桌面「保持整图可见、不溢出」不介入——
    // 但 1280 档实测 41 张宽图仍被 svg{max-width:100%} 压进 638px 正文栏，
    // 最差 ch37 案例四 viewBox 1491 → 638px（缩放 0.428），节点「CTO 阿坤」有效字号 6.85px。
    // 现在两档都按「这张图自己的最小自然字号」算出抬到 AINSE_MIN_FONT 所需的比例，
    // 多出来的宽度交给 .mermaid-block 的 overflow-x:auto，并由 ainseScrollFrame() 挂上滚动暗示。
    var AINSE_MIN_FONT = 11;   // px：图上任何一处文字在屏幕上真正显示出来的字号下限
    var AINSE_NARROW = 768;    // 与 theme.css 的窄屏分界保持一致
    var AINSE_MAX_UPSCALE = 1.2;  // 允许放大的上限：自然字号低于地板时（甘特刻度实测 10px）

    function ainseMinFontPx(svg) {
      var min = null;
      // flowchart 开了 htmlLabels，节点文字住在 foreignObject 里的 div 上；
      // 甘特/时序图的标签是 <text>。只查其一会把"有字的图"读成"没字的图"
      // （实测 ch05 两张图因此被当成无对象可判）。
      var nodes = svg.querySelectorAll('text, foreignObject *');
      for (var i = 0; i < nodes.length; i++) {
        if (!(nodes[i].textContent || '').trim()) continue;
        var fs = parseFloat(window.getComputedStyle(nodes[i]).fontSize) || 0;
        if (fs && (min === null || fs < min)) min = fs;
      }
      return min;
    }

    function ainseGuardDiagramWidth(host) {
      var svg = host.querySelector('svg');
      if (!svg || !svg.viewBox || !svg.viewBox.baseVal.width) return;
      var vbW = svg.viewBox.baseVal.width;
      var nat = ainseMinFontPx(svg);
      if (!nat) return;                                  // 纯图形（无文字）不适用字号判据
      // 抬到地板所需的缩放：nat≥11 时 <1（不许缩到地板以下），nat<11 时 >1（放大补回来，
      // 封顶 AINSE_MAX_UPSCALE）。上一版写成 Math.min(1, …)，等于宣布"自然字号本来就
      // 低于地板的图无救"——甘特刻度 10px 全站 8 张，两档视口都是 scale 1 仍 10px。
      var need = Math.min(AINSE_MAX_UPSCALE, AINSE_MIN_FONT / nat);
      var narrow = window.matchMedia('(max-width: ' + AINSE_NARROW + 'px)').matches;
      var target = narrow ? Math.max(need, 1) : need;
      svg.style.minWidth = '';                           // 先还原：否则宿主宽被上一次决定污染
      // 可用宽度取宿主自己的 clientWidth，不取父层：.mermaid-block 有 16px 左右内边距，
      // 拿它的 clientWidth（含 padding，实测 670）会把"还放得下"算多 32px——
      // 实测 README 首图 avail/vbW=0.815 ≥ 所需 0.786 于是原地不动，svg 却按
      // max-width:100% 缩进 638px 的内容宽，有效字号停在 10.87px。
      var avail = host.clientWidth || (host.parentElement || host).clientWidth;
      if (avail / vbW < target) {
        // 向上取整：round 会把 1001×(11/14)=786.2 打回 786，有效字号 10.99 —— 差 0.01px
        // 也是不合格，而这是守卫会逐张报红的差。
        svg.style.minWidth = Math.ceil(vbW * target) + 'px';
        host.classList.add('is-wide');
      } else {
        host.classList.remove('is-wide');
      }
      ainseScrollFrame(host.closest('.mermaid-block'));
    }

    // 滚动暗示层：给「内容比容器宽、可以横向滚」的图与表外套一层 .scroll-frame，
    // 左右各一片 .scroll-veil 渐隐加箭头。两处不是顺手写的：
    // ① 渐隐挂在**不滚动**的外层——挂在滚动容器自己的 ::before/::after 上，
    //    绝对定位的伪元素会随内容一起滚走，暗示跟着一起消失；
    // ② 渐隐一律 pointer-events:none——它压着的就是图节点与表格单元格，
    //    不关掉命中就是替读者把内容挡掉（第七道守卫逐点在右缘做命中测试）。
    function ainseVeil(side) {
      var s = document.createElement('span');
      s.className = 'scroll-veil ' + side;
      s.setAttribute('aria-hidden', 'true');             // 纯视觉暗示，读屏不念箭头
      return s;
    }

    function ainseScrollFrame(sc) {
      if (!sc || sc.nodeType !== 1) return null;
      // 已经建过层也要重算状态：doneEach 里的 ainseFramesAll() 会先把图框起来（那一刻
      // svg 还没被 ainseGuardDiagramWidth 撑宽，溢出量＝0），随后作图链才落地。
      // 早退不重算的话，暗示层永远停在"不可滚"那一态——实测 frame 类名一直是光秃秃的
      // .scroll-frame，读者看得到 1167px 的溢出却没有半个箭头。
      if (sc.__ainseSync) { sc.__ainseSync(); return sc.parentElement; }
      if (!sc.parentElement) return null;
      var frame = document.createElement('div');
      frame.className = 'scroll-frame';
      sc.parentNode.insertBefore(frame, sc);
      frame.appendChild(sc);
      frame.appendChild(ainseVeil('left'));
      frame.appendChild(ainseVeil('right'));
      function sync() {
        var max = sc.scrollWidth - sc.clientWidth;
        var x = sc.scrollLeft;
        frame.classList.toggle('scrollable', max > 2);
        frame.classList.toggle('has-right', max > 2 && x < max - 1);
        frame.classList.toggle('has-left', max > 2 && x > 1);
      }
      sc.addEventListener('scroll', sync, {passive: true});
      window.addEventListener('resize', sync);
      sc.__ainseSync = sync;
      sync();
      return frame;
    }

    function ainseFramesAll() {
      var els = document.querySelectorAll(
        '.markdown-section .mermaid-block, .markdown-section .table-scroll');
      for (var i = 0; i < els.length; i++) ainseScrollFrame(els[i]);
    }
    // opts.reset：出队时才把节点还原成源码（先还原＝会在上一批还在画时踩到同一节点）
    function ainseRunMermaid(nodes, why, opts) {
      if (typeof mermaid === 'undefined') return;
      opts = opts || {};
      var route = location.hash;
      var live = nodes.filter(function (el) { return document.contains(el); });
      nodes.length = 0;
      if (!live.length) return;
      ainseMermaidChain = ainseMermaidChain
        .then(function () {
          if (location.hash !== route) return null;
          var fresh = live.filter(function (el) { return document.contains(el); });
          if (!fresh.length) return null;
          if (opts.reset) {
            fresh.forEach(function (el) {
              el.removeAttribute('data-processed');
              el.textContent = el.getAttribute('data-source');
            });
          }
          if (opts.init) opts.init();
          return mermaid.run({ nodes: fresh }).then(function () {
            fresh.forEach(ainseGuardDiagramWidth);
          });
        })
        .catch(function (e) {
          var head = (live[0].getAttribute('data-source') || '').trim().split('\n')[0].slice(0, 40);
          console.error('mermaid 渲染失败（' + why + ' @ ' + route + ' · ' + head + '）：'
            + ((e && (e.message || e.str)) || Object.prototype.toString.call(e)));
        });
    }

    // 主题切换后按新配色重绘当前页全部 Mermaid 图
    function ainseRerenderMermaid(dark) {
      if (typeof mermaid === 'undefined') return;
      var nodes = [];
      document.querySelectorAll('.markdown-section .mermaid').forEach(function (el) {
        if (el.getAttribute('data-source')) nodes.push(el);
      });
      if (!nodes.length) return;
      ainseRunMermaid(nodes, '主题重绘', {
        reset: true,
        init: function () { ainseInitMermaid(dark); },
      });
    }

    var AINSE_ICONS = {
      moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
      sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>',
      up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
    };

    window.$docsify = {
      name: 'AI 原生软件工程',
      nameLink: '/',
      repo: '',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      onlyCover: false,
      alias: {
        '/manuscript/.*_sidebar.md': '/_sidebar.md',
        '/manuscript/.*_navbar.md': '/_navbar.md',
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md',
      },
      subMaxLevel: 3,
      maxLevel: 4,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索全书内容…',
        noData: '没有找到匹配结果',
        depth: 3,
      },
      auto2top: true,
      relativePath: false,
      themeColor: ainseToken('--c-accent'),
      formatUpdated: '{YYYY}-{MM}-{DD}',
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true,
      },
      plugins: [
        function pageFooter(hook) {
          var footer = [
            '<hr/>',
            '<footer class="page-footer">',
            '<p>《AI 原生软件工程》 · 当 AI 自己兜不住的时候，组织如何接管</p>',
            '<p>AI 做可能，人做选择，人做负责。</p>',
            '</footer>',
          ].join('');
          hook.afterEach(function (html) {
            return html + footer;
          });
        },
        // 图注挂号：全书 104 条图注在稿子里是 `**图 4-1｜四支柱** — 说明…`，
        // 渲染后与正文里的强调句完全同形，读者分不清哪句是图的话、哪句是作者的话。
        // 这里只挂一个类名，版式全部交给 theme.css；不改稿、不引入任何 CDN。
        function figureCaption(hook) {
          hook.afterEach(function (html) {
            return html.replace(
              /<p><strong>(图\s*[0-9A-Za-z]+-[0-9.]+[^<]*)<\/strong>/g,
              '<p class="figure-caption"><strong>$1</strong>'
            );
          });
        },
        // 表格滚动包裹层：窄屏要让宽表横向滚动，此前用 `table{display:block}` 实现，
        // 视觉上是通的，但 display:block 会把 <table> 的表格语义从可访问性树里抹掉
        // （读屏软件不再报出行列）。改成给表格套一层滚动容器，表格自己保持 table。
        function tableScroll(hook) {
          hook.afterEach(function (html) {
            return html.replace(
              /<table>[\s\S]*?<\/table>/g,
              function (t) { return '<div class="table-scroll">' + t + '</div>'; }
            );
          });
        },
        // Self-hosted Mermaid: convert ```mermaid fences after Docsify render
        function mermaidPlugin(hook, vm) {
          var mermaidNodes = [];

          function isCoverRoute() {
            var h = (location.hash || '#/').replace(/^#/, '').split('?')[0];
            return h === '' || h === '/' || h === '/';
          }

          // 封面显示期间渲染的图会因零尺寸布局塌陷（viewBox 退化），
          // 封面收起后对塌陷/仍不可见的图重新排版；对已正常的图是空操作
          function rerenderHidden() {
            if (typeof mermaid === 'undefined') return;
            if (document.querySelector('.cover.show')) return; // 封面仍在场，等收起再说
            var nodes = [];
            document.querySelectorAll('.markdown-section .mermaid').forEach(function (el) {
              var src = el.getAttribute('data-source');
              if (!src) return;
              var svg = el.querySelector('svg');
              if (svg && svg.getBoundingClientRect().width > 60) return;
              nodes.push(el);
            });
            if (!nodes.length) return;
            ainseRunMermaid(nodes, '封面收起补渲染', {
              reset: true,
              init: function () { ainseInitMermaid(ainseGetTheme() === 'dark'); },
            });
          }

          function watchCover() {
            var cover = document.querySelector('.cover');
            if (!cover || cover.dataset.ainseWatched) return;
            cover.dataset.ainseWatched = '1';
            new MutationObserver(function () {
              if (!cover.classList.contains('show')) {
                // rAF 在后台标签页不触发，用 setTimeout 保证重排一定发生
                setTimeout(rerenderHidden, 60);
              }
            }).observe(cover, { attributes: true, attributeFilter: ['class'] });
          }

          window.addEventListener('hashchange', function () {
            setTimeout(rerenderHidden, 60);
          });

          hook.doneEach(function () {
            if (typeof mermaid === 'undefined') return;
            ainseInitMermaid(ainseGetTheme() === 'dark');

            // Docsify wraps unrendered mermaid in <code class="lang-mermaid"> inside <pre>
            // ⚠ 三条候选都必须是 `pre` 的直接子元素：正文里的行内 `` `flowchart TD` `` 是一句话，
            // 不是图。先前的写法允许裸 `code.lang-mermaid`，于是下面那段兜底把 DIAGNOSIS 里的
            // 行内代码盖上章、又因为没有 `<pre>` 可替换而留在原地——读起来像"一张图没渲染"。
            var codes = document.querySelectorAll(
              '.markdown-section pre[data-lang="mermaid"] code, .markdown-section pre > code.lang-mermaid, .markdown-section pre > code.language-mermaid'
            );

            // Fallback: any **block** code whose text looks like mermaid diagram source
            if (!codes.length) {
              var all = document.querySelectorAll('.markdown-section pre > code');
              all.forEach(function (el) {
                var t = el.textContent || '';
                if (/^(flowchart|graph|sequenceDiagram|stateDiagram|erDiagram|gantt|mindmap|timeline|classDiagram|pie)\b/.test(t.trim())) {
                  el.classList.add('lang-mermaid');
                  codes = document.querySelectorAll('.markdown-section pre > code.lang-mermaid');
                }
              });
            }

            var i = 0;
            codes.forEach(function (code) {
              var pre = code.closest('pre');
              var source = code.textContent;
              if (!source || !source.trim()) return;
              var id = 'mermaid-' + Date.now() + '-' + (i++);
              var wrapper = document.createElement('div');
              wrapper.className = 'mermaid-block';
              var label = document.createElement('div');
              label.className = 'mermaid-label';
              wrapper.appendChild(label);
              var host = document.createElement('div');
              host.className = 'mermaid';
              host.id = id;
              host.textContent = source;
              host.setAttribute('data-source', source);
              wrapper.appendChild(host);
              if (pre && pre.parentNode) {
                pre.parentNode.replaceChild(wrapper, pre);
              }
              mermaidNodes.push(host);
            });

            if (mermaidNodes.length) {
              // 封面页（或封面尚未收起时）不做首绘：零尺寸布局会产出 NaN transform 的塌陷图；
              // 封面收起由 watchCover / hashchange 的 rerenderHidden 统一补渲染
              if (!isCoverRoute() && !document.querySelector('.cover.show')) {
                ainseRunMermaid(mermaidNodes, '首绘', {
                  init: function () { ainseInitMermaid(ainseGetTheme() === 'dark'); },
                });
              }
              mermaidNodes = [];
            }

            ainseFramesAll();   // 宽表在 afterEach 里已被套上 .table-scroll，这一层补上滚动暗示
            watchCover();
          });
        },
        // 出版级 UI：主题切换 / 阅读进度条 / 宽屏右侧 TOC / 返回顶部
        function uiPlugin(hook, vm) {
          function applyTheme(t, rerender) {
            var root = document.documentElement;
            if (t === 'dark') root.setAttribute('data-theme', 'dark');
            else root.removeAttribute('data-theme');
            try { localStorage.setItem(AINSE_THEME_KEY, t); } catch (e) {}
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', ainseToken('--c-desk'));
            var btn = document.getElementById('btn-theme');
            if (btn) btn.innerHTML = t === 'dark' ? AINSE_ICONS.sun : AINSE_ICONS.moon;
            if (rerender) ainseRerenderMermaid(t === 'dark');
          }

          // 书眉：这一章的标题钉在正文栏顶端，读者滚到任意一页仍知道自己在第几章。
          // 印刷书的 running head 是本章唯一的"常驻"元素，因此它必须不参与点击。
          var runHeadH1 = null;
          function buildRunHead() {
            var head = document.getElementById('running-head');
            if (!head) {
              head = document.createElement('div');
              head.className = 'running-head';
              head.id = 'running-head';
              head.setAttribute('aria-hidden', 'true');
              head.innerHTML = '<span class="rh-title"></span><span class="rh-book">AI 原生软件工程</span>';
              document.body.appendChild(head);
            }
            runHeadH1 = document.querySelector('.markdown-section h1');
            head.querySelector('.rh-title').textContent = runHeadH1 ? runHeadH1.textContent.trim() : '';
          }

          function updateRunHead() {
            var head = document.getElementById('running-head');
            if (!head) return;
            var past = false;
            if (runHeadH1) past = runHeadH1.getBoundingClientRect().bottom < 100;
            head.classList.toggle('is-on', past && !document.querySelector('section.cover.show'));
          }

          function buildToc() {
            var toc = document.getElementById('page-toc');
            if (!toc) return;
            toc.innerHTML = '';
            toc.classList.remove('has-items');
            var heads = document.querySelectorAll('.markdown-section h2[id], .markdown-section h3[id]');
            if (!heads.length || heads.length < 2) return;

            var path = (vm && vm.route && vm.route.path) || '';
            var frag = document.createDocumentFragment();
            var title = document.createElement('p');
            title.className = 'toc-title';
            title.textContent = '本页目录';
            frag.appendChild(title);

            heads.forEach(function (h) {
              var a = document.createElement('a');
              a.href = '#' + path + '?id=' + encodeURIComponent(h.id);
              a.textContent = h.textContent;
              a.className = h.tagName === 'H3' ? 'toc-h3' : 'toc-h2';
              a.setAttribute('data-target', h.id);
              frag.appendChild(a);
            });
            toc.appendChild(frag);
            toc.classList.add('has-items');
          }

          function updateTocActive() {
            var toc = document.getElementById('page-toc');
            if (!toc || !toc.classList.contains('has-items')) return;
            var links = toc.querySelectorAll('a[data-target]');
            if (!links.length) return;
            var activeId = null;
            links.forEach(function (a) {
              var h = document.getElementById(a.getAttribute('data-target'));
              if (h && h.getBoundingClientRect().top <= 120) activeId = a.getAttribute('data-target');
            });
            links.forEach(function (a) {
              a.classList.toggle('active', a.getAttribute('data-target') === activeId);
            });
          }

          function onScroll() {
            var c = document.querySelector('.content');
            if (!c) return;
            var bar = document.getElementById('reading-progress');
            if (bar) {
              var max = c.scrollHeight - c.clientHeight;
              var pct = max > 0 ? (c.scrollTop / max) * 100 : 0;
              bar.style.width = pct.toFixed(2) + '%';
            }
            var topBtn = document.getElementById('btn-back-top');
            if (topBtn) topBtn.classList.toggle('hidden', c.scrollTop < 480);
            updateTocActive();
            updateRunHead();
          }

          hook.init(function () {
            if (document.getElementById('float-controls')) return;

            var wrap = document.createElement('div');
            wrap.className = 'float-controls';
            wrap.id = 'float-controls';

            var themeBtn = document.createElement('button');
            themeBtn.className = 'float-btn';
            themeBtn.id = 'btn-theme';
            themeBtn.type = 'button';
            themeBtn.title = '切换深色 / 浅色主题';
            themeBtn.setAttribute('aria-label', '切换深色或浅色主题');
            themeBtn.addEventListener('click', function () {
              applyTheme(ainseGetTheme() === 'dark' ? 'light' : 'dark', true);
            });
            wrap.appendChild(themeBtn);

            var topBtn = document.createElement('button');
            topBtn.className = 'float-btn hidden';
            topBtn.id = 'btn-back-top';
            topBtn.type = 'button';
            topBtn.title = '返回顶部';
            topBtn.setAttribute('aria-label', '返回顶部');
            topBtn.innerHTML = AINSE_ICONS.up;
            topBtn.addEventListener('click', function () {
              var c = document.querySelector('.content');
              if (c) c.scrollTo({ top: 0, behavior: 'smooth' });
              else window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            wrap.appendChild(topBtn);

            document.body.appendChild(wrap);

            var bar = document.createElement('div');
            bar.className = 'reading-progress';
            bar.id = 'reading-progress';
            document.body.appendChild(bar);

            // Docsify 用 document.querySelector('nav') 认领站点顶栏（源码：b("nav")||w("nav")），
            // 这里若用 <nav> 就会被它抢走：顶栏内容灌进 TOC、.app-nav 的 fixed 全宽定位
            // 再叠加 .page-toc 的 z-index:90，结果顶栏与 TOC 双双压在侧边栏底下点不动。
            // TOC 因此用 div + role=navigation，把唯一的 <nav> 让给 Docsify 的顶栏。
            var toc = document.createElement('div');
            toc.className = 'page-toc';
            toc.id = 'page-toc';
            toc.setAttribute('role', 'navigation');
            toc.setAttribute('aria-label', '本页目录');
            document.body.appendChild(toc);

            applyTheme(ainseGetTheme(), false);

            // scroll 事件不冒泡，但捕获阶段能听到 .content 的滚动
            document.addEventListener('scroll', onScroll, true);
            window.addEventListener('resize', onScroll);

            // 键盘焦点的横向揭示。浏览器会把 Tab 走到的控件滚进**纵向**滚动容器
            // （1280 档实测：走到侧栏最后几条时 .sidebar 自己滚了），但实测**不会**为横向滚动
            // 容器做同一件事：390 档顶栏是一条 overflow-x:auto 的导航带（滚动口 12..378、内容宽
            // 428），Tab 到最右的「🔎 搜索」时该链接停在 x=375..440，focusin 里连一次 scroll
            // 事件都没有（监听器实测计数为空），焦点环被裁到只剩左侧 2px。
            // 这里的补法只碰"焦点所在的那一条横向滚动带"：纵向不动它（那是浏览器已经做对的部分），
            // 也不给带子换布局（窄屏导航条不换行是既定设计，见 theme.css 的同名注释）。
            // 余量 6px = 环宽 2 + offset 2 + 2，让整条环落在滚动口内而不是刚够到边。
            document.addEventListener('focusin', function (e) {
              var el = e && e.target;
              if (!el || !el.getBoundingClientRect) return;
              for (var p = el.parentElement; p && p !== document.body; p = p.parentElement) {
                var ox = getComputedStyle(p).overflowX;
                if (ox !== 'auto' && ox !== 'scroll') continue;
                var a = el.getBoundingClientRect(), s = p.getBoundingClientRect();
                var dx = 0;
                if (a.right > s.right) dx = a.right - s.right + 6;
                else if (a.left < s.left) dx = a.left - s.left - 6;
                if (dx) p.scrollLeft += dx;
              }
            });
          });

          hook.doneEach(function () {
            buildToc();
            buildRunHead();
            onScroll();
          });
        },
      ],
    }
  </script>
